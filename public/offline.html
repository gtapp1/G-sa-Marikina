<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E8590C" />
    <title>Offline — G sa Marikina</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --background: #fffbf5;
        --surface: #ffffff;
        --brand: #eb1700;
        --primary: #e8590c;
        --primary-hover: #ea580c;
        --text-primary: #3d2c1e;
        --text-secondary: #78716c;
        --border: #f5e6d3;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--background);
        color: var(--text-primary);
        font-family: "Sora", "Segoe UI", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        line-height: 1.5;
      }
      .card {
        max-width: 420px;
        width: 100%;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        border-radius: 18px;
        background: var(--brand);
        color: #fff;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -2px;
        margin-bottom: 28px;
        box-shadow: 0 4px 12px rgba(61, 44, 30, 0.12);
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0 0 12px;
      }
      p {
        font-size: 16px;
        color: var(--text-secondary);
        margin: 0 0 28px;
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 700;
        font-size: 16px;
        min-height: 48px;
        padding: 0 28px;
        border-radius: 6px;
        transition: background 150ms ease;
      }
      button:hover { background: var(--primary-hover); }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">G!</div>
      <h1>You're offline</h1>
      <p>
        We can't reach G sa Marikina right now. Check your connection and try
        again — your local food finds will be right here.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
